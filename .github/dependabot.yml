version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Wait a week before proposing a new release, so a compromised version is likely
    # caught and pulled before it reaches this repo. Security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  # Base images in the Dockerfile and the production Compose file (pinned by digest).
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Major base-image upgrades (a new Node line, a new PostgreSQL version) need a deliberate,
    # tested migration, so they are done by hand. Patch, minor, and digest updates still arrive.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Major base-image upgrades (a new Node line, a new PostgreSQL version) need a deliberate,
    # tested migration, so they are done by hand. Patch, minor, and digest updates still arrive.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
