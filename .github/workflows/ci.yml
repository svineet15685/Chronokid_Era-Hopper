name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Check generated database migrations
        run: |
          npm run db:generate
          if [[ -n "$(git status --porcelain -- apps/api/drizzle)" ]]; then
            echo "Generated migrations are out of date. Review and commit the generated files."
            git status --short -- apps/api/drizzle
            exit 1
          fi