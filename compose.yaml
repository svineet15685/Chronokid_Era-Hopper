services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chronokid
      POSTGRES_USER: chronokid
      POSTGRES_PASSWORD: chronokid
    ports:
      - "5432:5432"
    volumes:
      - chronokid-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronokid -d chronokid"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  chronokid-postgres: